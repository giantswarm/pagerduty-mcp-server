# app-test-suite config for the generated `execute-chart-tests` CI job.
#
# The deployment requires a non-optional `PAGERDUTY_USER_API_KEY` sourced from an
# existing `pagerduty-mcp` secret (see helm/pagerduty-mcp-server/templates/deployment.yaml).
# That secret is not present in the ephemeral kind test cluster, so the pod cannot
# start and the smoke suite cannot pass. Skip smoke (with functional/upgrade) until
# test-values that provision a dummy secret are added; the job still validates that
# the chart packages cleanly via build-chart.
skip-steps: [smoke, functional, upgrade]
